<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardStock.Web</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />

    <link rel="preload" href="fonts/inter/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/inter/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/inter/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/inter-tight/inter-tight-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/inter-tight/inter-tight-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/jetbrains-mono/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/jetbrains-mono/jetbrains-mono-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="favicon.svg" />
    <link href="CardStock.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script>
      (function () {
        var t = localStorage.getItem('cardstock-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        if (localStorage.getItem('cardstock-cvd') === '1') document.documentElement.setAttribute('data-cvd', '1');
      })();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="lib/lightweight-charts/lightweight-charts.standalone.production.js"></script>
    <script src="js/lwc-interop.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="js/site.js"></script>
</body>

</html>
